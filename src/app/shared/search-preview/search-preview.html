<form [formRoot]="searchForm" role="search" aria-label="Chèche nan diksyonè a">
  <label for="mo" class="sr-only">Chèche yon mo</label>
  <div
    class="flex items-center gap-2 rounded-2xl bg-paper p-1.5 shadow-[0_18px_50px_-20px_rgba(0,0,0,0.6)] ring-1 ring-white/10 focus-within:ring-2 focus-within:ring-gold"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      class="ml-3 size-5 shrink-0 text-ink-soft"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <input
      id="mo"
      type="search"
      [formField]="searchForm.mo"
      placeholder="Egzanp: konbit"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      enterkeyhint="search"
      class="min-w-0 flex-1 bg-transparent py-3 text-lg text-ink placeholder:text-ink-soft/80 focus:outline-none"
    />
    <button
      type="submit"
      class="shrink-0 rounded-xl bg-red px-4 py-3 font-semibold text-white hover:bg-[#b00d2b] focus-visible:outline-gold sm:px-6"
    >
      Chèche
    </button>
  </div>
</form>

<div aria-live="polite" class="mt-4 min-h-14 text-base">
  @switch (result().kind) {
    @case ('empty') {
      <p class="text-periwinkle">Ekri yon mo anvan ou chèche.</p>
    }
    @case ('not-ready') {
      <p class="rounded-xl bg-white/5 px-4 py-3 text-sand ring-1 ring-white/10">
        Diksyonè a poko pare, kidonk nou poko ka montre w mo
        <strong class="font-serif text-gold">«{{ word() }}»</strong>.
        <a
          [href]="proposeHref()"
          class="ml-1 font-semibold whitespace-nowrap text-gold underline underline-offset-4"
        >
          Pwopoze mo sa a →
        </a>
      </p>
    }
  }
</div>
