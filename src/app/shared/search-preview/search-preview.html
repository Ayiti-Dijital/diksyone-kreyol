<form [formRoot]="searchForm" role="search" aria-label="Chèche nan diksyonè a">
  <label for="mo" class="sr-only">Chèche yon mo</label>
  <div
    class="flex items-center rounded-full border border-line bg-white py-1 pr-1 pl-5 shadow-[0_1px_6px_rgba(23,30,70,0.08)] focus-within:border-link focus-within:ring-2 focus-within:ring-link/20"
  >
    <input
      id="mo"
      type="search"
      [formField]="searchForm.mo"
      placeholder="Chèche yon mo, egzanp: konbit"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      enterkeyhint="search"
      class="min-w-0 flex-1 bg-transparent py-2 text-base text-text placeholder:text-muted focus:outline-none"
    />
    <button
      type="submit"
      aria-label="Chèche"
      class="grid size-10 shrink-0 place-items-center rounded-full bg-navy text-white hover:bg-navy-deep"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        class="size-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="6.5" />
        <path d="m20 20-4-4" />
      </svg>
    </button>
  </div>
</form>

<div aria-live="polite" class="text-sm">
  @switch (result().kind) {
    @case ('empty') {
      <p class="mt-3 text-center text-muted">Ekri yon mo anvan ou chèche.</p>
    }
    @case ('not-ready') {
      <p class="mt-3 rounded-md border border-line bg-mist px-4 py-3 text-center text-text">
        Diksyonè a poko pare, kidonk nou poko ka montre w mo
        <strong class="text-link">«{{ word() }}»</strong>.
        <a
          [href]="proposeHref()"
          class="ml-1 font-semibold whitespace-nowrap text-red underline underline-offset-4"
        >
          Pwopoze mo sa a →
        </a>
      </p>
    }
  }
</div>
